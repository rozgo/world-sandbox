[project]
name = "world-sandbox"
version = "0.1.0"
description = "World-model and 3D reconstruction experiments, each with an engineering journal"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# The AMB3R-SLAM runtime: Linux with an NVIDIA GPU. Native parts are built by
# scripts/setup_slam.sh after `uv sync --extra slam`.
slam = [
    "torch>=2.3",
    "torchvision",
    "scipy",
    "opencv-python<4.12",
    "pyyaml",
    "omegaconf",
    "einops",
    "safetensors",
    "huggingface_hub<1",
    "addict",
    "imageio",
    "trimesh",
    "tqdm",
    "evo",
    "pycolmap>=3.12",
    "kiss-icp==1.3.0",
    "open3d",
    "requests",
    "setuptools",
    "ninja",
    "cmake",
    "pip",
]

[project.scripts]
slam-trace = "world_sandbox.slam.trace:main"
slam-figures = "world_sandbox.slam.figures:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world_sandbox"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'",
                "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
